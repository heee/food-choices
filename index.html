<html lang="en">

<style>
/* VOICE everyday iPhone app, calm and a little luxurious
   IDEA each meal is a playing card; the day is a hand of four, dealt into slots
   ICONS outline dishes per meal: cup, bowl, cookie, knife and fork
   PICTURE physical cards: solid card stock with a layered drop shadow and a thin edge, a full-bleed photo window, name and macros below
   COLOUR warm off-white and deep charcoal, muted grey-sage accent, hairline rules, four quiet suit inks
   TYPE Inter Tight for names and numbers, Inter for text; light weights, tabular numerals, small tracked labels
   LAYOUT phone column: olive summary band, sheet with day switcher and four meal rows, glass tab bar; a tapped card lifts into a full-screen deck */
:root{color-scheme:light;--isw:1.4;--km:.78;--kb:1.25;
 --fd:"Inter Tight",Inter,-apple-system,system-ui,sans-serif;--fn:"Inter Tight",Inter,-apple-system,system-ui,sans-serif;--fb:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
 --page:#efefea;--sheet:#fafaf7;--ink:#1d201e;--mute:#71756f;--line:#e4e4de;--soft:#f2f2ee;
 --band:#e6eae3;--bink:var(--ink);--bmute:var(--mute);--btrack:rgba(29,32,30,.09);--bline:var(--line);--bfill:var(--soft);
 --acc:#6d7d6a;--bar:var(--acc);--pri:#1d201e;--prink:#fafaf7;--over:#b0533d;--tom:var(--over);
 --ivory:#faf9f5;--cglow:transparent;--cink:#1d201e;--cmute:#7a7d77;--cr:10px;--fr:5px;
 --s1:#9c7a45;--s2:#5d755a;--s3:#4a5567;--s4:#955a4c;--s5:#7d5c74;
 --lacc:#e3e8df;--laccink:#1d201e;--toast:#232624;--tabon:rgba(29,32,30,.08);--glass:rgba(250,250,247,.38);--gline:rgba(29,32,30,.08)}

*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--page);color:var(--ink)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.lk{overflow:hidden}
body{font:16px/1.45 var(--fb);overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button,[role=button]{cursor:pointer}
/* bottom clearance: the safe area; only when shown framed inside another app on a phone (e.g. a viewer whose own bottom panel covers the page), a fixed 120px */
:root{--chrome:0px;--botm:max(env(safe-area-inset-bottom,0px),var(--chrome))}
@media (pointer:coarse){html.framed.inapp{--chrome:120px}}
[hidden]{display:none!important}
.app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--sheet)}
.band{background:var(--band);color:var(--bink);padding:max(14px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) 44px max(24px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font:500 19px/1.1 var(--fd);letter-spacing:-.015em;margin:0}
.gbtn{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--bline);background:var(--bfill);font-weight:600;font-size:14px}
.mb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}
.mb>div{display:flex;flex-direction:column;gap:0}
.mb .ml{display:flex;align-items:center;gap:5px;margin-bottom:6px;font-size:13px;font-weight:400;line-height:1.3;color:var(--bmute);white-space:nowrap}
.mb .ml svg{flex:none;width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:var(--isw);stroke-linecap:round;stroke-linejoin:round}
.mb .mv{margin-bottom:9px;font:500 16px/1.2 var(--fd);letter-spacing:-.01em;color:var(--bink);font-variant-numeric:tabular-nums;white-space:nowrap}
.mb .mv small{font-weight:400;font-size:13px;margin-left:1px;color:var(--bmute)}
.over .ml svg,.over .mv{color:var(--over)}
.kpill{display:flex;flex-direction:row;align-items:center;gap:10px;min-height:44px;padding:0;margin-right:-2px;border:0;background:none;color:var(--bink)}
.kt{font-size:12px;color:var(--bmute);white-space:nowrap}
.kt b{font:500 15px/1 var(--fn);color:var(--bink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kbar{display:block;order:-1;flex:none;width:56px;height:3px;border-radius:2px;background:var(--btrack);overflow:hidden}
.kbar i{display:block;height:100%;border-radius:2px;background:var(--acc);transition:width .4s}
.kpill.over .kbar i{background:var(--over)}.kpill.over .kt b{color:var(--over)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:58px;margin:0 0 16px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:none;text-align:left}
.setrow b{display:block;font-weight:500;font-size:15px}.setrow small{display:block;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.setrow em{font-style:normal;font-weight:600;color:var(--pri);font-size:15px}
.bar{height:2px;border-radius:1px;background:var(--btrack);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--bar);transition:width .4s}
.over .bar i{background:var(--over)}
.sheet{position:relative;background:var(--sheet);border-radius:24px 24px 0 0;margin-top:-24px;box-shadow:0 -1px 0 rgba(255,255,255,.7),0 -10px 30px rgba(29,32,30,.05);padding:16px max(16px,env(safe-area-inset-right)) calc(var(--botm) + 110px) max(16px,env(safe-area-inset-left))}
.dayp{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;gap:8px;align-items:center;margin:-4px 0 4px}
.dayp button{height:36px;min-height:36px;padding:0;border:0;border-radius:18px;background:var(--soft);font-weight:400;font-size:16px;line-height:1;color:var(--ink)}
.dayp button:disabled{opacity:.35}
.dayp .dl{display:flex;align-items:center;justify-content:center;gap:9px;font:500 15px var(--fn);letter-spacing:-.005em}
.dayp .dl svg{width:15px;height:15px;flex:none;fill:none;stroke:var(--mute);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
#v-today{touch-action:pan-y}
.calh{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;margin-bottom:10px}
.calh h2{text-align:center;margin:0!important}
.calnav{min-height:44px;border:0;background:none;font-size:20px;color:var(--ink);border-radius:10px}
.calnav:disabled,.calg button:disabled{opacity:.28;cursor:default}
.calw,.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.calw span{font-size:10.5px;font-weight:500;letter-spacing:.08em;color:var(--mute);padding:4px 0 6px}
.calg{row-gap:2px}
.calg button{position:relative;justify-self:center;width:42px;height:42px;border:0;border-radius:50%;background:none;color:var(--ink);font:400 15px var(--fn);font-variant-numeric:tabular-nums}
.calg button i{position:absolute;left:50%;bottom:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:transparent}
.calg button.has i{background:var(--acc)}
.calg button.tod{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent);font-weight:600}
.calg button.sel{background:var(--pri);color:var(--prink);box-shadow:none;font-weight:500}
.calg button.sel i{background:transparent}.calg button.sel.has i{background:var(--prink)}
.calk{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 0;font-size:12px;color:var(--mute)}
.calk i{width:4px;height:4px;border-radius:50%;background:var(--acc)}
.meal{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 2px;border-bottom:1px dotted color-mix(in srgb,var(--line) 75%,transparent);border-radius:4px;outline-offset:2px}
.meal:last-child{border-bottom:0}
.ico{width:24px;height:24px;display:grid;place-items:center;color:var(--suit)}
.ico svg{width:20px;height:20px;overflow:visible}
.ico svg *{fill:none;stroke:currentColor;stroke-width:calc(var(--isw) * .78);stroke-linecap:round;stroke-linejoin:round}
.mt{display:flex;flex-direction:column}
.mt b{font:500 16px/1.2 var(--fd);letter-spacing:-.01em}
.kc{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.kc.over{color:var(--tom)}
.mn{font-size:14px;font-weight:400;margin-top:2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rp{font-size:12px;color:var(--acc)}
.thumb{width:64px;height:64px;position:relative}
.emptyc{width:64px;height:64px;border-radius:8px;border:1px dashed color-mix(in srgb,var(--mute) 55%,transparent);display:grid;place-items:center;color:var(--mute)}
.emptyc svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.3;fill:none;stroke-linecap:round}
.cw{position:relative;flex:none}
.cw.r{width:64px;height:64px}
.rcd{position:absolute;inset:0;padding:3px;border-radius:8px;background:linear-gradient(180deg,#fdfcf9 0,var(--ivory) 50%,#f1efe8 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 .5px 0 #e2dfd6,0 1.5px 0 #d2cec2,0 1px 1px rgba(0,0,0,.08),0 3px 3px rgba(0,0,0,.07),0 6px 8px rgba(0,0,0,.06)}
.rart{width:100%;height:100%;border-radius:5px;overflow:hidden}
.rart svg,.rart img{width:100%;height:100%;object-fit:cover;display:block}
.cw.m{width:calc(220px*var(--km));height:calc(308px*var(--km))}
.cw.b{width:calc(220px*var(--kb));height:calc(308px*var(--kb))}
.nb{width:100%;height:100%;transition:opacity .15s}
.pc{position:absolute;left:0;top:0;width:220px;height:308px;transform-origin:0 0;perspective:1600px}
.m .pc{transform:scale(var(--km))}.b .pc{transform:scale(var(--kb))}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.pc.flipped .flip{transform:rotateY(180deg)}
.side{position:absolute;inset:0;border-radius:var(--cr);background:linear-gradient(180deg,#fdfcf9 0,var(--ivory) 45%,#f3f1ea 100%);color:var(--cink);-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 .5px rgba(29,32,30,.07),0 .5px 0 #e2dfd6,0 1.5px 0 #d6d2c7,0 1px 1px rgba(29,32,30,.07),0 3px 3px rgba(29,32,30,.06),0 6px 6px rgba(29,32,30,.05),0 12px 12px rgba(29,32,30,.045),0 24px 24px rgba(29,32,30,.035);transition:box-shadow .25s ease}
.back{transform:rotateY(180deg)}
.pc:not(.flipped) .back,.pc.flipped .front{pointer-events:none}
.b .side{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 .5px 0 #e2dfd6,0 1.5px 0 #cfcbbf,0 2px 2px rgba(0,0,0,.14),0 6px 8px rgba(0,0,0,.14),0 14px 20px rgba(0,0,0,.16),0 30px 48px rgba(0,0,0,.24)}
.tag{position:absolute;top:18px;left:18px;max-width:calc(100% - 36px);padding:3px 6px;border-radius:3px;background:rgba(250,249,245,.88);font:500 6.5px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:#4c504b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art{position:absolute;top:10px;left:10px;right:10px;height:150px;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.tag.kcp{font-variant-numeric:tabular-nums}
.tag.src{left:auto;right:18px;max-width:calc(100% - 104px);display:flex;align-items:center;gap:4px}
.tag svg{width:1.45em;height:1.45em;margin:-.3em -.1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.art svg,.art img{width:100%;height:100%;object-fit:cover;display:block}
.ctx{position:absolute;top:172px;left:18px;width:184px;text-align:left;white-space:normal;overflow-wrap:anywhere;word-break:normal}
.pc h3{width:100%;margin:0;font:500 15px/1.18 var(--fd);letter-spacing:-.015em;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:2.36em}
.dsc{width:100%;margin:5px 0 0;font:400 9.5px/1.38 var(--fb);color:var(--cmute);white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:2.76em}
.m .ctx{top:180px}
.m .pc h3{font-size:19px;-webkit-line-clamp:3;max-height:3.54em}
.m .dsc{display:none}
.m .art{height:158px}
.mac{position:absolute;bottom:16px;left:18px;right:18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.bk .mac{position:static;margin:9px 0 2px}
.mac span{display:flex;flex-direction:column;align-items:center;gap:1px;font:500 6px var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--cmute)}
.mac svg{width:10px;height:10px;margin-bottom:2px;fill:none;stroke:var(--cmute);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mac b{font:500 11px/1.1 var(--fn);letter-spacing:0;text-transform:none;color:var(--cink);font-variant-numeric:tabular-nums}
.m .mac{display:none}
.m .tag{font-size:8px}
.bk{position:absolute;inset:15px 14px;overflow-y:auto;overflow-x:hidden;white-space:normal;overflow-wrap:anywhere;word-break:normal;font-size:10.5px;line-height:1.42;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.bk h4{font:500 14px/1.2 var(--fd);letter-spacing:-.01em;margin:0 0 2px}
.bk h5{font:500 7.5px var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--suit);margin:10px 0 4px}
.bk p{margin:0;color:var(--cmute)}
.bk ul,.bk ol{margin:0;padding-left:14px}
.bk li{margin:0 0 2px}
.bk *{max-width:100%;white-space:normal}
.bk .mac span{white-space:nowrap}
/* back of card: one step smaller below the name so more of the recipe fits */
.bk>p{font-size:9px;line-height:1.4}
.bk li{font-size:9.5px;line-height:1.4}
.bk .mac span{font-size:5.5px}
.bk .mac b{font-size:9.5px}
.bk .mac svg{width:9px;height:9px}
.bk h5{margin:8px 0 3px}
.view[hidden]{display:none}
.vh2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 10px}
.vh2 h2{font:500 21px/1.15 var(--fd);letter-spacing:-.015em;margin:0}
.sub2{color:var(--mute);font-size:14px;margin:0 0 12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
/* Library: title and category chips stay pinned while the grid scrolls under them */
.libhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--sheet);margin:-16px -16px 14px;padding:16px 16px 2px;border-radius:24px 24px 0 0;transition:box-shadow .2s}
.libhead.stuck{border-radius:0;box-shadow:0 1px 0 var(--line),0 8px 16px -10px rgba(29,32,30,.12)}
#stb{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--sheet);z-index:6;display:none}
html.stuck #stb{display:block}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:none;font-weight:500;font-size:13.5px}
.chip.on,.chip[aria-checked=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
.libgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
.libc{display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:10px;outline-offset:4px}
.libc .nb,.thumb .nb{transition:transform .25s cubic-bezier(.2,.7,.3,1),opacity .15s}
.libc:active .nb,.meal:active .thumb .nb{transform:translateY(-3px)}
@media(hover:hover){.libc:hover .nb,.meal:hover .thumb .nb{transform:translateY(-3px)}}
.sgroup{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.sgroup h3{font:500 15px/1.25 var(--fd);margin:0}
.sgroup p{margin:2px 0 8px;font-size:13px;color:var(--mute)}
.item{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;border-top:1px solid var(--line);cursor:pointer}
.item input{width:22px;height:22px;accent-color:var(--pri);flex:none}
.item.done span{text-decoration:line-through;color:var(--mute)}
.item em{font-style:normal;font-weight:600;color:var(--pri);margin-left:auto;white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.ptiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.ptiles div{background:var(--soft);border-radius:12px;padding:12px}
.ptiles b{display:block;font:500 clamp(18px,5.4vw,22px)/1.1 var(--fn);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.ptiles span{font-size:13px;color:var(--mute)}
.prow{display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;gap:10px;align-items:center;min-height:52px;border-top:1px solid var(--line)}
.prow .pd{font-weight:600;font-size:14px}
.prow .pd small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.ptrack{position:relative;height:4px;border-radius:2px;background:var(--soft)}
.ptrack i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--acc)}
.ptrack.over i{background:var(--tom)}
.ptrack s{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.35;left:calc(100%/1.2)}
.pv{font:600 14px var(--fn);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pv small{display:block;font-weight:600;color:var(--mute);font-size:13px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--botm) + 14px);width:min(428px,calc(100% - 28px));z-index:30;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:6px;border-radius:20px;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.8);backdrop-filter:blur(14px) saturate(1.8);border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 20px rgba(0,0,0,.08)}
.tabs button{border:0;background:none;border-radius:10px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;letter-spacing:.02em;color:var(--mute)}
.tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{background:var(--tabon);color:var(--ink)}
#lift{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;color:#f1f1ed}
#lift[hidden]{display:none}
.dim{position:absolute;inset:0;background:rgba(14,15,14,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);touch-action:none}
.lhead{position:relative;z-index:2;display:flex;align-items:center;gap:2px;padding:max(14px,env(safe-area-inset-top)) 16px 6px;touch-action:none}
.lhead div{flex:1}
.lhead h2{font:500 21px/1.1 var(--fd);letter-spacing:-.015em;margin:0}
.lhead span{font-size:14px;color:#a9aca5}
.hic{position:relative;width:44px;height:44px;display:grid;place-items:center;border:0;background:none;padding:0;color:#f1f1ed;flex:none}
.hic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.hic.kid{opacity:.45;transition:opacity .2s}
.hic.kid[aria-checked=true]{opacity:1}
.hic.kid i{position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:0;transition:opacity .2s}
.hic.kid[aria-checked=true] i{opacity:1}
.rail{position:relative;z-index:1;flex:1;display:flex;align-items:center;gap:18px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:-120px;padding:120px calc(50% - 110px*var(--kb)) calc(var(--botm) + 160px)}
.rail::-webkit-scrollbar{display:none}
.rail .cw{scroll-snap-align:center}
.rail .front{touch-action:pan-x}
.rail .empty{flex:1;color:#bfc1bb}
.lbar{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(var(--botm) + 92px);width:min(428px,calc(100% - 28px));height:54px;display:flex;align-items:center;gap:4px;padding:0 6px;border-radius:16px;background:rgba(38,40,38,.62);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,.09);box-shadow:0 8px 24px rgba(0,0,0,.25);touch-action:none}
.lbar svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.lbar button{border:0;background:none;color:#f1f1ed;min-height:44px;border-radius:11px;transition:background .15s,color .15s}
.lbar button:disabled{opacity:.35}
.lk{display:flex;align-items:center;gap:7px;padding:0 12px 0 10px;font-weight:500;font-size:14px;white-space:nowrap}
.lk .ic{display:none}.lk.locked .ic{display:inline}.lk.locked .ia{display:none}
.lk.locked{color:var(--lacc)!important;cursor:default}
.lk.go{background:var(--lacc)!important;color:var(--laccink)!important}
.repw{position:relative}
.repb{display:flex;align-items:center;gap:2px;padding:0 6px 0 10px;font-size:13.5px;color:#c9cbc5!important}
.repb svg{width:15px;height:15px}
.reps{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;min-width:128px;padding:5px;border-radius:13px;background:rgba(38,40,38,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.reps[hidden]{display:none}
.rep{min-height:40px!important;padding:0 12px;text-align:left;font-size:14px;border-radius:9px!important}
.rep.on{background:rgba(255,255,255,.12)!important}
.lsep{width:1px;height:24px;background:rgba(255,255,255,.14);margin:0 2px;flex:none}
.lacts{display:flex;align-items:center;margin-left:auto}
.lacts button{width:44px;display:grid;place-items:center;padding:0}
.lacts button[hidden]{display:none}
.lacts button.on{color:var(--lacc)}
@media(hover:hover){.lbar button:not(:disabled):hover{background:rgba(255,255,255,.08)}}
#lnote{position:absolute;left:0;right:0;bottom:calc(100% + 8px);margin:0;font-size:12px;color:#a9aca5;text-align:center;pointer-events:none}
html.lk .tabs{z-index:45;background:rgba(38,40,38,.62);border-color:rgba(255,255,255,.1);box-shadow:0 8px 24px rgba(0,0,0,.25)}
html.lk .tabs button{color:#c9ccc5}
html.lk .tabs button.on{background:rgba(255,255,255,.14);color:#f6f6f1}
.tabs{transition:background-color .26s,border-color .26s,box-shadow .26s}.tabs button{transition:color .26s,background-color .26s}
html.lk #toast{bottom:calc(var(--botm) + 160px)}
.small{font-size:13px;color:var(--mute);margin:16px 2px 0}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;display:flex;justify-content:center}
#sheet[hidden]{display:none}
#sheetIn{width:100%;max-width:460px;background:var(--sheet);color:var(--ink);border-radius:14px 14px 0 0;padding:20px max(18px,env(safe-area-inset-left)) calc(var(--botm) + 20px);max-height:88vh;max-height:88dvh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
#sheetIn h2{font:500 18px/1.2 var(--fd);letter-spacing:-.01em;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 14px;font-size:15px}
.btn{min-height:46px;border-radius:10px;border:1px solid var(--line);background:none;font-weight:500;font-size:15px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--prink)}
.btn.sm{min-height:40px;font-size:14px;border-radius:10px}
.ddw{position:relative}
.dd{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 14px;border:0;border-radius:18px;background:var(--soft);font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap}
.dd svg{width:16px;height:16px;fill:none;stroke:var(--mute);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.dd[aria-expanded=true] svg{transform:rotate(180deg)}
.ddm{position:absolute;right:0;top:calc(100% + 6px);z-index:8;min-width:210px;padding:6px;border-radius:14px;background:var(--sheet);border:1px solid var(--line);box-shadow:0 12px 32px rgba(29,32,30,.14)}
.ddm button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:9px;background:none;font-size:15px;color:var(--ink);text-align:left}
.ddm button:active{background:var(--soft)}
.ddm .ck{display:grid;place-items:center;width:20px;height:20px;flex:none;border-radius:6px;border:1.4px solid var(--line)}
.ddm .ck svg{width:14px;height:14px;fill:none;stroke:var(--sheet);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ddm [aria-checked=true] .ck{background:var(--pri);border-color:var(--pri)}
.ddm [aria-checked=true] .ck svg{opacity:1}
.ddm hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.ddm .rd .ck{border:0;background:none!important}.ddm .rd .ck svg{stroke:var(--ink)}
.hacts{display:flex;align-items:center;gap:4px}
.ibtn{width:40px;height:40px;display:grid;place-items:center;padding:0;border:0;border-radius:20px;background:none;color:var(--ink)}
.ibtn:active{background:var(--soft)}
.ibtn.busy{opacity:.4;pointer-events:none}
.item .snt{flex:none;display:grid;place-items:center;margin-left:4px;color:var(--mute)}
.item em+.snt{margin-left:4px}
.item span+.snt{margin-left:auto}
.item .snt svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ibtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .wide{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}
.form .ck{flex-direction:row;align-items:center;gap:10px;min-height:44px;color:var(--ink)}
.form .ck input{width:22px;height:22px;min-height:0;accent-color:var(--pri)}
.form input,.form select,textarea{font-size:16px;min-height:46px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:8px 12px;width:100%}
textarea{min-height:100px;font:15px/1.4 var(--fb)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* toasts match the tab bar: same width, radius, glass and border; they sit one tab-bar gap above it */
#toast{position:fixed;left:50%;bottom:calc(var(--botm) + 96px);transform:translateX(-50%);width:min(428px,calc(100% - 28px));box-sizing:border-box;min-height:52px;padding:6px 6px 6px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:90;border-radius:20px;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.8);backdrop-filter:blur(14px) saturate(1.8);border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 20px rgba(0,0,0,.08);color:var(--ink);font-size:15px;font-weight:500}
#toastT{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.lk #toast{background:rgba(38,40,38,.62);border-color:rgba(255,255,255,.1);box-shadow:0 8px 24px rgba(0,0,0,.25);color:#f6f6f1}
#toast[hidden]{display:none}
#toast button{flex:none;border:0;background:none;color:var(--s2);font-weight:600;font-size:15px;min-height:40px;padding:0 12px;border-radius:14px}
#toast button:active{background:var(--tabon)}
html.lk #toast button{color:#cfe0c8}
#toast:not(.has) button{display:none}
@media(prefers-reduced-motion:reduce){.flip,.bar i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="band">
    <div class="top"><h1>Food choices</h1><button class="kpill" id="kpill" aria-live="polite"><span class="kt"><b id="kv">0</b> <span id="kl">kcal left</span></span><span class="kbar"><i id="kfill"></i></span></button></div>
    <div class="mb" id="macs"></div>
  </header>
  <main class="sheet">
    <section class="view" id="v-today">
      <div class="dayp"><button id="dprev" aria-label="Previous day">‹</button><button class="dl" id="dlabel" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="M15.5 15.5h.01"/></svg><span id="dlt">Today</span></button><button id="dnext" aria-label="Next day">›</button></div>
      <div id="meals"></div>
    </section>
    <section class="view" id="v-library" hidden>
      <div class="libhead" id="libhead"><div class="vh2"><h2>Library</h2><div class="ddw"><button class="dd" id="libdd" aria-haspopup="true" aria-expanded="false" aria-controls="libddm"><span id="libddT">All categories</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button><div class="ddm" id="libddm" role="menu" aria-label="Filter the library" hidden></div></div></div></div>
      <div class="libgrid" id="lib"></div>
      
    </section>
    <section class="view" id="v-shopping" hidden>
      <div class="vh2"><h2>Shopping</h2><div class="hacts"><div class="ddw"><button class="dd" id="shopdd" aria-haspopup="true" aria-expanded="false" aria-controls="shopddm"><span id="shopddT">7 days</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button><div class="ddm" id="shopddm" role="menu" aria-label="Shopping range" hidden></div></div><button class="ibtn" id="sendTodo" aria-label="Send to Todoist" title="Send to Todoist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5L10.2 13.8"/><path d="M20.5 3.5l-6.3 17-4-6.7-6.7-4z"/></svg></button><button class="ibtn" id="todoSet" aria-label="Todoist settings" title="Todoist settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button></div></div>
      <p class="sub2" id="shopsum"></p>
      <div id="shoplist"></div>
    </section>
    <section class="view" id="v-progress" hidden>
      <div class="vh2"><h2>Progress</h2></div>
      <p class="sub2">Your planned meals for the next 7 days against your daily targets.</p>
      <button class="setrow" id="openSet"><span><b>Daily targets</b><small id="tsum"></small></span><em>Edit</em></button>
      <button class="setrow" id="openTodo"><span><b>Todoist</b><small id="tdsum"></small></span><em>Edit</em></button>
      <div class="ptiles" id="ptiles"></div>
      <div id="pdays"></div>
    </section>
  </main>
</div>
<div id="stb" aria-hidden="true"></div>
<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-view="today"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Today</button>
  <button data-view="library"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="12" height="17" rx="2.5"/><path d="M4.5 6.5v11a3 3 0 0 0 3 3h8"/></svg>Library</button>
  <button data-view="shopping"><svg viewBox="0 0 24 24"><path d="M3.5 9h17l-1.6 9.2a2 2 0 0 1-2 1.8H7.1a2 2 0 0 1-2-1.8z"/><path d="M8 9l3-5M16 9l-3-5"/></svg>Shopping</button>
  <button data-view="progress"><svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Progress</button>
</nav>

  <div class="lbar" id="lbar">
    <button class="lk" id="lockBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ia" d="M12 18.5V6M6.5 11.5 12 6l5.5 5.5"/><path class="ic" d="M5.5 12.5l4.2 4.2 8.8-9.2"/></svg><span id="lockT">Lock in</span></button>
    <div class="repw"><button class="repb" id="repBtn" aria-haspopup="true" aria-expanded="false"><span id="repT">Once</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10l4 4 4-4"/></svg></button><div class="reps" id="reps" role="radiogroup" aria-label="How many days" hidden></div></div>

    <p id="lnote" aria-live="polite"></p>
  </div>
</div>

const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

{const ids=new Set(BASE.concat(custom).map(m=>m.id)),gone=k=>!ids.has(String(k).split('|')[0]);let n=0;

function all(){return BASE.concat(custom)}

 ['A01',/banana|\bapples?\b|lemon|\blimes?\b|berr(y|ies)|orange juice|oranges?\b|grapes|avocado|spinach|arugula|lettuce|salad|cucumber|tomato(?!\s*paste)|onion|scallion|garlic clove|carrot|bell pepper|green beans|potato|broccoli|zucchini|mushroom|celery|\bfresh\b|dill|parsley|cilantro|basil|\bherbs?\b/],
 ['A02',/chicken|turkey|\bbeef\b|\bpork\b|salmon|shrimp|\bfish\b|sourdough|\bbread\b|pita|tortilla/],
 ['Back',/\bmilk\b|\beggs?\b|yogh?urt|cheese|\bfeta\b|\bbutter\b|\bcream\b/],
 ['A07',/granola bar/],
 ['A08',/almonds?\b|walnut|pecan|pistachio|cashew|\bnuts\b/],

  toast(`${cat(c).n} locked in${n>1?` for ${n} days`:` for ${dayLabel(st.day).toLowerCase()==='today'?'today':fmt(st.day,{weekday:'long'})}`}`,()=>{st.plan=JSON.parse(prev);renderAll()});
}
/* swipe up to lock */
const TH=70;let pd=null,suppress=false;
rail.addEventListener('pointerdown',e=>{suppress=false;const el=e.target.closest('.cw');if(!el)return;const pc=el.querySelector('.pc');
  const m=L.list[L.i],lk=locked(L.cat);pd={el,x:e.clientX,y:e.clientY,dy:0,moved:false,drag:false,ok:+el.dataset.i===L.i&&!(pc&&pc.classList.contains('flipped')),lk:!!(m&&lk&&lk.id===m.id),id:e.pointerId}});
rail.addEventListener('pointermove',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y;if(Math.hypot(dx,dy)>8)pd.moved=true;
  if(pd.ok&&!pd.drag&&Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)*1.2){pd.drag=dy<0?'up':'down';try{pd.el.setPointerCapture(pd.id)}catch(x){}}
  if(pd.drag==='down'){e.preventDefault();pd.dy=Math.max(0,dy);const v=pd.dy<160?pd.dy:160+(pd.dy-160)*.3;if(pd.lk){pd.el.style.transform=`translateY(${(v*.8).toFixed(1)}px)`;$('#lockT').textContent=pd.dy>TH?'Release to unlock':'Locked'}else{pd.el.style.transform=`translateY(${v.toFixed(1)}px) scale(${(1-Math.min(.06,pd.dy/2500)).toFixed(3)})`;$('.dim').style.opacity=String(1-Math.min(.45,pd.dy/450));$('#lockT').textContent=pd.dy>TH?'Release to go back':'Lock in'}}
  else if(pd.drag){e.preventDefault();pd.dy=Math.min(0,dy);const v=pd.dy>-150?pd.dy:-150+(pd.dy+150)*.3;pd.el.style.transform=`translateY(${v.toFixed(1)}px)`;const ok=pd.dy<-TH;$('#lockBtn').classList.toggle('go',ok);$('#lockT').textContent=ok?'Release to lock':'Lock in'}});
function endDrag(cancel){if(!pd)return;const p=pd;pd=null;
  if(p.drag==='down'){suppress=true;$('.dim').style.opacity='';if(!cancel&&p.dy>TH&&p.lk)unlockCur(p.el);else if(!cancel&&p.dy>TH){closeLift();p.el.style.transform=''}else{const t=p.el.style.transform;p.el.style.transform='';p.el.animate([{transform:t},{transform:'none'}],{duration:dur(220),easing:'ease-out'});updFoot()}}
  else if(p.drag){suppress=true;if(!cancel&&p.dy<-TH)lockNow(p.el);else{const t=p.el.style.transform;p.el.style.transform='';p.el.animate([{transform:t},{transform:'none'}],{duration:dur(220),easing:'ease-out'});updFoot()}}
  else if(p.moved)suppress=true}
rail.addEventListener('pointerup',()=>endDrag(false));
rail.addEventListener('pointercancel',()=>endDrag(true));
rail.addEventListener('click',e=>{if(suppress){suppress=false;return}const el=e.target.closest('.cw');if(!el)return;const i=+el.dataset.i;if(i!==L.i)go(i);else flipCur()});
$('#lockBtn').onclick=()=>{const m=L.list[L.i],e=locked(L.cat);if(!m||(e&&e.id===m.id&&L.rep===left(e)))return;const el=rail.children[L.i];el.animate([{transform:'none'},{transform:'translateY(-90px)'}],{duration:dur(180),easing:'ease-in'}).finished.catch(()=>{}).then(()=>lockNow(el))};
$('#reps').onclick=e=>{const b=e.target.closest('[data-rep]');if(b){repMenu(false);commitRep(+b.dataset.rep)}};
function repMenu(on){$('#reps').hidden=!on;$('#repBtn').setAttribute('aria-expanded',String(on))}
$('#repBtn').onclick=e=>{e.stopPropagation();repMenu($('#reps').hidden)};
lift.addEventListener('click',e=>{if(!e.target.closest('.repw'))repMenu(false)});
$('#lkid').onclick=()=>{const m=L.list[L.i];st.kid=!st.kid;save();$('#lkid').setAttribute('aria-checked',String(st.kid));buildRail(m?Math.max(0,deck(L.cat).findIndex(x=>x.id===m.id)):0)};
$('#lclose').onclick=()=>closeLift();
$('#dim').onclick=()=>closeLift();
document.querySelector('.lacts').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const m=L.list[L.i];if(!m)return;const a=b.dataset.a;
  if(a==='copy')copyText(foodvisor(m),'Copy for Foodvisor','Copied, paste it into Foodvisor');
  if(a==='rm'){const prev=JSON.stringify(st.plan),c=L.cat;delete st.plan[st.day][c];closeLift(false);renderAll();toast(`${cat(c).n} removed`,()=>{st.plan=JSON.parse(prev);renderAll()})}
  if(a==='del'){const prevC=custom.slice(),prevP=JSON.stringify(st.plan);custom=custom.filter(x=>x.id!==m.id);for(const k in st.plan)for(const c in st.plan[k])if(st.plan[k][c].id===m.id)delete st.plan[k][c];saveCustom();closeLift(false);renderAll();
    toast(`${m.name} deleted`,()=>{custom=prevC;st.plan=JSON.parse(prevP);saveCustom();renderAll()})}};

/* ---------- page events ---------- */
document.addEventListener('click',e=>{
  const dw=e.target.closest('.ddw');if(!dw)closeMenus();
  if(e.target.closest('#sheet,#lift'))return;
  let b;
  if(b=e.target.closest('[data-view]')){if(L.open)closeLift(false);st.view=b.dataset.view;renderAll();scrollTo(0,0)}
  else if(b=e.target.closest('[data-slot]'))openLift(b.dataset.slot);
  else if(b=e.target.closest('[data-lib]')){const m=byId(b.dataset.lib);if(m)openLift(m.cat,m.id,b.querySelector('.cw'))}
  else if(e.target.closest('#libdd'))libMenu($('#libddm').hidden);
  else if(e.target.closest('#shopdd'))ddMenu('shopdd',$('#shopddm').hidden);
  else if(b=e.target.closest('#libddm [data-lc]')){const id=b.dataset.lc;if(id==='all')st.libcats=[];else{const a=st.libcats.filter(x=>x!==id);if(a.length===st.libcats.length)a.push(id);st.libcats=a.length===CATS.length?[]:CATS.map(c=>c.id).filter(x=>a.includes(x))}renderLibrary();save()}
  else if(b=e.target.closest('#libddm [data-lt]')){st[b.dataset.lt]=!st[b.dataset.lt];renderLibrary();save()}
  else if(b=e.target.closest('[data-shopd]')){st.shopDays=+b.dataset.shopd;ddMenu('shopdd',false);renderAll()}
  else if(e.target.closest('#dprev'))stepDay(-1);
  else if(e.target.closest('#dnext'))stepDay(1);
  else if(e.target.closest('#dlabel'))calSheet(st.day);
  else if(e.target.closest('#openSet'))setSheet();
  else if(e.target.closest('#openTodo'))todoSheet();
  else if(e.target.closest('#kpill')){const o=['left','planned','target'];st.kmode=o[(o.indexOf(st.kmode||'left')+1)%3];renderTop();save()}
  else if(e.target.closest('#sendTodo'))sendTodo();
  else if(e.target.closest('#todoSet'))todoSheet();
  else if(e.target.closest('#scrim'))closeSheet();
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.ck;if(!k)return;if(e.target.checked)st.checked[k]=true;else delete st.checked[k];renderAll()});
$('#scrim').onclick=closeSheet;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const o=[...document.querySelectorAll('.ddm')].find(m=>!m.hidden);if(o){closeMenus();$('#'+o.id.slice(0,-1)).focus();return}}
  if(!$('#sheet').hidden){if(e.key==='Escape')closeSheet();return}
  if(L.open){
    if(e.key==='Escape')closeLift();
    else if(e.key==='ArrowLeft'){e.preventDefault();go(L.i-1)}
    else if(e.key==='ArrowRight'){e.preventDefault();go(L.i+1)}
    else if(e.key==='ArrowUp'){e.preventDefault();$('#lockBtn').click()}
    return}
  const s=e.target.closest&&e.target.closest('[data-slot],[data-lib]');
  if(s&&(e.key==='Enter'||e.key===' ')){e.preventDefault();s.click()}
});
const ro=new ResizeObserver(()=>{sizing();if(L.open)requestAnimationFrame(()=>{const el=rail.children[L.i];if(el&&el.classList.contains('cw'))rail.scrollLeft=center(el);fx()})});
ro.observe(document.body);
/* swipe left or right on Today to change day */
{const vt=$('#v-today');let sw=null,swSup=false;
 vt.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;sw={x:e.clientX,y:e.clientY}});
 vt.addEventListener('pointerup',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;
   if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){swSup=true;setTimeout(()=>swSup=false,400);stepDay(dx<0?1:-1)}});
 vt.addEventListener('pointercancel',()=>{sw=null});
 document.addEventListener('click',e=>{if(swSup){swSup=false;e.stopPropagation();e.preventDefault()}},true)}
sizing();renderAll();
}
</script>
